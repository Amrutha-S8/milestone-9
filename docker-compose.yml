version: "3.9"

services:
  app:
    build: .
    container_name: stayza-milestone9
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STAYZA_HOST=0.0.0.0
      - STAYZA_PORT=8000
      - STAYZA_WORKERS=4
      - STAYZA_RELOAD=false
      - STAYZA_CORS_ORIGINS=*
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./review_data:/app/review_data
      - ./backup:/app/backup
      - ./final_reports:/app/final_reports
      - ./datasets:/app/datasets
      - ./languages:/app/languages
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

